[appearance]
prefer_no_csd = true
border_width = 2               # 0-100
outer_border_width = 1         # 0-100
corner_radius = 15             # 0-100, final outer edge; 0 disables
drag_opacity = 0.6

[appearance.blur]
enabled = true
optimized = false 
passes = 3        # 0-8
radius = 2        # 0-100
noise = 0.02      # 0.0-1.0
brightness = 0.9  # 0.0-2.0
contrast = 0.9    # 0.0-2.0
saturation = 1.1  # 0.0-2.0

[appearance.shadow]
enabled = true
softness = 10      # 0-200
offset_x = 2       # -200 to 200
offset_y = 2
