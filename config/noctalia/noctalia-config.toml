[bar]
order = [ "default" ]

    [bar.default]
    attach_panels = true
    background_opacity = 0.75
    capsule = false
    capsule_border = "primary"
    capsule_opacity = 0.14999999105930328
    center = [ "cpu", "ram", "temp", "sysmon" ]
    color = "primary"
    contact_shadow = false
    end = [ "screen_recorder", "notifications", "clipboard", "bluetooth", "volume", "brightness", "session" ]
    margin_ends = 10
    margin_h = 5
    margin_v = 5
    padding = 10
    position = "left"
    reserve_space = true
    start = [ "control-center", "launcher", "bongocat", "media", "workspaces", "tray" ]
    thickness = 25
    widget_spacing = 10

[battery.device."/org/freedesktop/UPower/devices/battery_hidpp_battery_0"]
warning_threshold = 10

[battery.device."/org/freedesktop/UPower/devices/headphones_dev_AC_BF_71_DD_05_5C"]
warning_threshold = 20

[brightness]
enable_ddcutil = true

[calendar]
enabled = true

