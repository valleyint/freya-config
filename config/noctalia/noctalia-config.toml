[noctalia_state]
setup_wizard_completed = true

[notification]
background_opacity = 0.5
layer = "overlay"
position = "top_center"

[osd]
background_opacity = 0.5
offset_y = 5.0
position = "top_center"

[shell]
avatar_path = "me.jpg"
font_family = "Jetbrains Mono"
lang = "en"
password_style = "random"
polkit_agent = true
screen_time_enabled = true
settings_show_advanced = true
time_format = "{:%H:%M:%S}"

    [shell.panel]
    clipboard_placement = "attached"
    control_center_placement = "attached"
    open_near_click_clipboard = true
    open_near_click_wallpaper = true
    session_placement = "centered"
    transparency_mode = "soft"

    [shell.screen_corners]
    enabled = true
    size = 32

    [[shell.session.actions]]
    action = "lock"
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    enabled = true
    shortcut = "5"
    variant = "destructive"

    [[shell.session.actions]]
    action = "logout"
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "suspend"
    enabled = true
    shortcut = "3"
    variant = "default"

[system.monitor]
cpu_poll_seconds = 1
disk_poll_seconds = 5
gpu_poll_seconds = 1
memory_poll_seconds = 1

[theme]
builtin = "Rosé Pine"
community_palette = "Catppuccin Lavender"
custom_palette = "Catppuccin Macchiato"
source = "custom"
wallpaper_scheme = "m3-rainbow"

    [theme.templates]
    builtin_ids = [ "kitty" ]

[wallpaper]
directory = "/home/darshan/wallpapers"
transition = [ "honeycomb", "stripes" ]

    [wallpaper.default]
    path = "/home/darshan/wallpapers/20.jpg"

    [wallpaper.last]
    path = "/home/darshan/wallpapers/20.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/darshan/wallpapers/20.jpg"

[weather]
address = "Bengaluru,India"
refresh_minutes = 5

[widget.bongocat]
script = "scripts/bongocat.lua"
type = "scripted"

[widget.cpu]
display = "gauge"

[widget.launcher]
color = "primary"
glyph = "heart"
use_distro_logo = true

[widget.network]
show_label = false

[widget.ram]
display = "text"
show_label = false
stat = "ram_pct"

[widget.screen_recorder]
script = "scripts/screen_recorder.lua"
type = "scripted"

[widget.sysmon]
display = "gauge"
stat = "disk_pct"

[widget.taskbar]
inactive_opacity = 0.75
only_active_workspace = true

[widget.temp]
display = "gauge"
show_label = false

[widget.workspaces]
capsule = false
color = "primary"
display = "id"
occupied_color = "#EEBBAA"
